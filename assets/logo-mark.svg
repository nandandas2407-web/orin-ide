<svg width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OrinIDE">
  <defs>
    <linearGradient id="ring-grad" x1="280" y1="220" x2="1040" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9D5CFF"/>
      <stop offset="0.42" stop-color="#7C3AED"/>
      <stop offset="0.75" stop-color="#3B2173"/>
      <stop offset="1" stop-color="#160B2E"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="745" y1="845" x2="1080" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9D5CFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Broken ring: full circle minus a gap at lower-left where the chevron tail exits -->
  <path d="M600 213
           A 410 410 0 1 1 248 822"
        fill="none" stroke="url(#ring-grad)" stroke-width="90" stroke-linecap="round"/>

  <!-- Chevron ">" mark -->
  <path d="M458 432 L790 637 L458 842 L458 706 L600 637 L458 568 Z"
        fill="#F8F6FF"/>

  <!-- Cursor bar "_" -->
  <rect x="752" y="848" width="234" height="90" rx="12" fill="url(#bar-grad)"/>
</svg>
